_BASE_: "../Base_PoseTrack18_5_frame.yaml"
EXPERIMENT_NAME: 'OTAPose_Network'
WORKERS: 4
GPUS: (1,)
OUTPUT_DIR: 'output'
CUDNN:
  BENCHMARK: true
  DETERMINISTIC: true
  ENABLED: true
CORE_FUNCTION: Function_No_Supp_Targ_5_Frame_OT

MODEL:
  NAME: OTAPose
  BACKBONE_NAME: vit

  FRAME_NUM: 5
  EXTRA:
    ADD_POS_EMB: false
    DYNAMIC_PRUNE: true
    DYNAMIC_ALPHA: 0.25
    USE_COARSE_STE_TTE: true
    DYNAMIC_MIN_KEEP_FINE: 32
    DYNAMIC_MAX_KEEP_FINE: 512
    DYNAMIC_MIN_KEEP_COARSE: 32
    DYNAMIC_MAX_KEEP_COARSE: 1024
    USE_OT_DISTILLATION: true
    INFERENCE_SINGLE_BRANCH_LRB: true
    USE_SINGLE_BRANCH_LOSS: true
    SINGLE_BRANCH_LOSS_WEIGHT: 1
    OT_LOSS_WEIGHT: 1
    # 是否将backbone特征拼接至输出头（True=拼接，False=不拼接）
    FINAL_FUSION_BACKBONE: true
    OT_LAMBDA_POS: 0.1
    OT_BLUR: 0.05

  VIT:
    PATCH_SIZE: 16
    EMB_DIM: 1024
    DEPTH: 24
    NUM_HEADS: 16
    DROP_PATH_RATE: 0.5

    DECONV1_IN_CHN: 1024
    DECONV1_OUT_CHN: 256
    DECONV2_IN_CHN: 256
    DECONV2_OUT_CHN: 256
    FINAL_CONV_IN_CHN: 256
    FINAL_CONV_OUT_CHN: 17

  HEAD:
    DECONV1_IN_CHN: 1024
    DECONV1_OUT_CHN: 256
    DECONV2_IN_CHN: 256
    DECONV2_OUT_CHN: 128
    FINAL_CONV_IN_CHN: 128
    FINAL_CONV_OUT_CHN: 17

LOSS:
  USE_TARGET_WEIGHT: true

TRAIN:
  AUTO_RESUME: true
  LR: 0.00005
  BEGIN_EPOCH: 0
  END_EPOCH: 24
  OPTIMIZER: adamW
  MILESTONES:
    - 16
    - 20
  GAMMA: 0.1
  SAVE_MODEL_PER_EPOCH: 1
  BATCH_SIZE_PER_GPU: 12
VAL:
  BATCH_SIZE_PER_GPU: 64
  MODEL_FILE: ''
TEST:
  BATCH_SIZE_PER_GPU: 64
  MODEL_FILE: ''

DEBUG:
  VIS_SKELETON: false
  VIS_BBOX: false
  VIS_HEATMAP: false
