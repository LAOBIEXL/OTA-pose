_BASE_: "../Base_PoseTrack17.yaml"
EXPERIMENT_NAME: 'v24'
#把heatmap改为vit了，现在改成hrnet的
WORKERS: 3
PRINT_FREQ: 50
GPUS: (0,)
#GPUS: (0,1,2,3)
OUTPUT_DIR: './output/DiffusionPose/'

DISTANCE: 3
CORE_FUNCTION: DPFunction_v24
DATASET:
  NAME: "PoseTrack_Difference_v2"

MODEL:
  FREEZE_HRNET_WEIGHTS: true
  NAME: DiffusionPoseV24
  PRETRAINED: './DcPose_supp_files/pretrained_models/out_model.pth'
  IMAGE_SIZE:
    - 288
    - 384
  HEATMAP_SIZE:
    - 72
    - 96

LOSS:
  HEATMAP_MSE:
    USE: true
    WEIGHT: 1.0

TRAIN:
  AUTO_RESUME: true
  SAVE_MODEL_PER_EPOCH: 1
  BATCH_SIZE_PER_GPU: 82
  LR: 5e-4
  OPTIMIZER: adamw
#  OPTIMIZER: adam
  END_EPOCH: 60
  MILESTONES:
    - 10
    - 20
    - 30
    - 36
  LR_STEP:
    - 8
    - 16

VAL:
  BATCH_SIZE_PER_GPU: 80
  MODEL_FILE: '/home/lf/diff/DiffPose/output/DiffusionPose/v24/PoseTrack_Difference_v217/bbox_1.25_rot_45_scale_0.65-1.35_MseLoss_1.0/checkpoints/epoch_59_state.pth'
  USE_GT_BBOX: false
  FLIP_VAL: true
  FLIP: true
  COCO_BBOX_FILE: './DcPose_supp_files/posetrack17_precomputed_boxes/DetectoRS_val_boxes.json'
#  COCO_BBOX_FILE: './DcPose_supp_files/posetrack17_precomputed_boxes/ConvNext_posetrack17_val_boxes.json'

TEST:
  BATCH_SIZE_PER_GPU: 64


DEBUG:
  VIS_SKELETON: false
  VIS_BBOX: false
